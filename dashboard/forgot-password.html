<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>(function(){try{var s=localStorage.getItem('maxdev-theme');var d=s?s==='dark':(matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.classList.add('dark-mode');}catch(e){}})();</script>
    <title>Forgot Password — MaxDev Dashboard</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/fonts/font-awesome.min.css">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="db-auth-body">
    <div class="db-auth-card">
        <div class="db-auth-brand">
            <img src="assets/images/logo.svg" alt="MaxDev">
            <h1>Forgot Password</h1>
            <p>Account recovery</p>
        </div>
        <div class="db-auth-note" id="forgotNote">
            An OTP has been sent to your registered email address.
        </div>
        <button type="button" class="db-pill-btn accent" id="continueBtn">Continue to Verification</button>
        <p class="db-auth-links"><a href="login.html">Back to Login</a></p>
    </div>
    <script src="assets/js/toast.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/pages/forgot-password.js"></script>
</body>
</html>
