<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>(function(){try{var s=localStorage.getItem('maxdev-theme');var d=s?s==='dark':(matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.classList.add('dark-mode');}catch(e){}})();</script>
    <title>Reset Password — MaxDev Dashboard</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/fonts/font-awesome.min.css">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="db-auth-body">
    <div class="db-auth-card">
        <div class="db-auth-brand">
            <img src="assets/images/logo.svg" alt="MaxDev">
            <h1>Reset Password</h1>
            <p>Choose a new password</p>
        </div>
        <form id="resetForm" novalidate>
            <div class="db-form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" class="db-input" placeholder="At least 6 characters" required minlength="6">
            </div>
            <div class="db-form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" class="db-input" placeholder="Repeat password" required minlength="6">
            </div>
            <button type="submit" class="db-pill-btn accent">Reset Password</button>
        </form>
    </div>
    <script src="assets/js/toast.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/pages/reset-password.js"></script>
</body>
</html>
