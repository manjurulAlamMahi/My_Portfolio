<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>(function(){try{var s=localStorage.getItem('maxdev-theme');var d=s?s==='dark':(matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.classList.add('dark-mode');}catch(e){}})();</script>
    <title>About — MaxDev Admin</title>
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../assets/fonts/font-awesome.min.css">
    <link rel="stylesheet" href="../assets/css/tokens.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/modules/about.css">
</head>
<body>
    <div class="db-shell">
        <div id="shellSidebar"></div>
        <div class="db-main-wrap">
            <div id="shellHeader"></div>
            <main class="db-main">
                <div class="db-page-header">
                    <div><h1>About</h1><p>Bio, stats, services, toolbox and testimonials on the About page</p></div>
                </div>
                <div class="db-tabstrip" id="tabStrip"></div>

                <section class="db-tab-panel" data-tab="bio">
                    <div class="db-card">
                        <h3 class="db-card-title">Bio & Availability</h3>
                        <div class="db-form-group"><label for="bioP1">Bio Paragraph 1</label><textarea id="bioP1" class="db-textarea"></textarea></div>
                        <div class="db-form-group"><label for="bioP2">Bio Paragraph 2</label><textarea id="bioP2" class="db-textarea"></textarea></div>
                        <div class="db-form-group"><label for="availText">Availability Text</label><input id="availText" class="db-input"></div>
                        <button type="button" class="db-pill-btn accent" id="saveBio">Save Bio</button>
                    </div>
                </section>

                <section class="db-tab-panel" data-tab="stats">
                    <div class="db-card">
                        <h3 class="db-card-title">Stat Counters</h3>
                        <div class="db-grid db-grid-4" id="statsFields"></div>
                        <button type="button" class="db-pill-btn accent" id="saveStats" style="margin-top:18px;">Save Stats</button>
                    </div>
                </section>

                <section class="db-tab-panel" data-tab="services">
                    <div class="db-card">
                        <h3 class="db-card-title">What I Do</h3>
                        <div id="servicesList"></div>
                        <button type="button" class="db-pill-btn outline" id="addService"><i class="fa fa-plus"></i> Add Service</button>
                        <button type="button" class="db-pill-btn accent" id="saveServices" style="margin-left:10px;">Save Services</button>
                    </div>
                </section>

                <section class="db-tab-panel" data-tab="toolbox">
                    <div class="db-card">
                        <h3 class="db-card-title">Toolbox</h3>
                        <div class="db-toolbox-grid" id="toolboxGrid"></div>
                        <div style="margin-top:16px;">
                            <button type="button" class="db-pill-btn outline" id="addTool"><i class="fa fa-plus"></i> Add Tool</button>
                            <button type="button" class="db-pill-btn accent" id="saveToolbox" style="margin-left:10px;">Save Toolbox</button>
                        </div>
                    </div>
                </section>

                <section class="db-tab-panel" data-tab="testimonials">
                    <div class="db-card">
                        <h3 class="db-card-title">Testimonials</h3>
                        <div id="testimonialsList"></div>
                        <button type="button" class="db-pill-btn outline" id="addTestimonial"><i class="fa fa-plus"></i> Add Testimonial</button>
                        <button type="button" class="db-pill-btn accent" id="saveTestimonials" style="margin-left:10px;">Save Testimonials</button>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <script src="../assets/js/paths.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/seed-data.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/guard.js"></script>
    <script src="../assets/js/toast.js"></script>
    <script src="../assets/js/modal.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/fullscreen.js"></script>
    <script src="../assets/js/shell.js"></script>
    <script src="../assets/js/pages/about.js"></script>
</body>
</html>
