<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>(function(){try{var s=localStorage.getItem('maxdev-theme');var d=s?s==='dark':(matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.classList.add('dark-mode');}catch(e){}})();</script>
    <title>Projects — MaxDev Admin</title>
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../assets/fonts/font-awesome.min.css">
    <link rel="stylesheet" href="../assets/css/tokens.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/modules/projects.css">
</head>
<body>
    <div class="db-shell">
        <div id="shellSidebar"></div>
        <div class="db-main-wrap">
            <div id="shellHeader"></div>
            <main class="db-main">
                <div class="db-page-header">
                    <div><h1>Projects</h1><p>Case studies shown on the live Projects page</p></div>
                    <a href="project-form.html" class="db-pill-btn accent"><i class="fa fa-plus"></i> Add Project</a>
                </div>
                <div class="db-table-wrap">
                    <div class="db-table-toolbar">
                        <div class="db-search-input"><i class="fa fa-search"></i><input type="text" id="searchInput" placeholder="Search projects..."></div>
                        <div id="categoryFilters" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
                    </div>
                    <div class="db-row-card-header">
                        <span></span>
                        <span>Project</span>
                        <span>Category</span>
                        <span>Tech Stack</span>
                        <span>Status</span>
                        <span class="col-actions">Actions</span>
                    </div>
                    <div id="projectsRows"></div>
                    <div class="db-empty-state" id="emptyState" style="display:none;">No projects match your search.</div>
                </div>
            </main>
        </div>
    </div>
    <script src="../assets/js/paths.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/seed-data.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/guard.js"></script>
    <script src="../assets/js/toast.js"></script>
    <script src="../assets/js/modal.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/fullscreen.js"></script>
    <script src="../assets/js/shell.js"></script>
    <script src="../assets/js/pages/projects.js"></script>
</body>
</html>
