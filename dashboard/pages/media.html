<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>(function(){try{var s=localStorage.getItem('maxdev-theme');var d=s?s==='dark':(matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.documentElement.classList.add('dark-mode');}catch(e){}})();</script>
    <title>Media Library — MaxDev Admin</title>
    <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../assets/fonts/font-awesome.min.css">
    <link rel="stylesheet" href="../assets/css/tokens.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/modules/uploader.css">
    <link rel="stylesheet" href="../assets/css/modules/media.css">
</head>
<body>
    <div class="db-shell">
        <div id="shellSidebar"></div>
        <div class="db-main-wrap">
            <div id="shellHeader"></div>
            <main class="db-main">
                <div class="db-page-header">
                    <div><h1>Media Library</h1><p>A shared pool of every image used on the live site — avatars, logo, and project screenshots — kept in one place so you can reuse or swap them without re-uploading inside each module.</p></div>
                </div>
                <div class="db-card">
                    <h3 class="db-card-title">Upload New Media</h3>
                    <div id="newMediaUploader"></div>
                    <div class="db-media-add-form">
                        <div class="db-form-group"><label>Label</label><input class="db-input" id="newMediaLabel" placeholder="e.g. Team photo"></div>
                        <div class="db-form-group"><label>Tag</label>
                            <select class="db-select" id="newMediaTag">
                                <option value="avatar">Avatar</option>
                                <option value="logo">Logo</option>
                                <option value="work">Work</option>
                                <option value="screenshot">Screenshot</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <button type="button" class="db-pill-btn accent" id="addMediaBtn">Add to Library</button>
                    </div>
                </div>
                <div class="db-media-grid" id="mediaGrid" style="margin-top:22px;"></div>
            </main>
        </div>
    </div>
    <script src="../assets/js/paths.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/seed-data.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/guard.js"></script>
    <script src="../assets/js/toast.js"></script>
    <script src="../assets/js/modal.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/fullscreen.js"></script>
    <script src="../assets/js/uploader.js"></script>
    <script src="../assets/js/shell.js"></script>
    <script src="../assets/js/pages/media.js"></script>
</body>
</html>
