<!DOCTYPE html>
<html lang="en">

<head>
    <!-- META -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Ask about Juliana Doe — WordPress designer & developer">
    <meta name="author" content="Md Shamsuzzaman">
    <!-- PAGE TITLE -->
    <title>Ask Juliana — Pretty Portfolio</title>
    <link rel="icon" href="assets/images/favicon.png" type="image/x-icon"/>
    <!-- FONT AWESOME CSS -->
    <link rel="stylesheet" href="assets/fonts/font-awesome.min.css">
    <!-- AI CHAT CSS -->
    <link rel="stylesheet" href="assets/css/ai-chat.css?v=2">
</head>

<body class="ai-chat-body">

    <!-- ====================== Top Bar ====================== -->
    <div class="ai-chat-topbar">
        <div class="ai-brand">
            <img src="assets/images/me.jpg" alt="Juliana Doe">
            <div class="ai-brand-text">
                <h1>Ask Juliana</h1>
                <span>AI assistant &middot; demo</span>
            </div>
        </div>
        <a href="index.html" class="ai-chat-back"><i class="fa fa-times"></i> <span>Back to Portfolio</span></a>
    </div>

    <!-- ====================== Chat Area ====================== -->
    <div class="ai-chat-main" id="aiChatMain">
        <div class="ai-chat-scroll" id="aiChatScroll">
            <div class="ai-chat-intro">
                <img src="assets/images/me.jpg" alt="Juliana Doe">
                <h2>Hi, I'm Juliana's AI assistant</h2>
                <p>Ask me about her background, services, projects or how to get in touch — I'll answer on her behalf.</p>
            </div>
        </div>
    </div>

    <!-- ====================== Suggestions ====================== -->
    <div class="ai-suggestions">
        <button type="button" class="ai-suggestion-btn" data-query="Tell me about Juliana">About</button>
        <button type="button" class="ai-suggestion-btn" data-query="What services do you offer?">Services</button>
        <button type="button" class="ai-suggestion-btn" data-query="Show me your projects">Projects</button>
        <button type="button" class="ai-suggestion-btn" data-query="Tell me about your resume">Resume</button>
        <button type="button" class="ai-suggestion-btn" data-query="How can I contact you?">Contact</button>
    </div>

    <!-- ====================== Input Bar ====================== -->
    <div class="ai-chat-inputbar">
        <div class="ai-input-inner">
            <input type="text" id="aiChatInput" placeholder="Ask a question about Juliana..." autocomplete="off">
            <button type="button" class="ai-send-btn" id="aiChatSend"><i class="fa fa-paper-plane"></i></button>
        </div>
        <p class="ai-chat-footnote">Answers are a static demo for now — a live AI backend is planned next.</p>
    </div>

    <!-- AI CHAT JS -->
    <script src="assets/js/ai-chat.js"></script>
</body>

</html>
